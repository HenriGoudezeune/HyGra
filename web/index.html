<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyGra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --olive: #3B461C; --olive-deep: #2E3714; --olive-soft: #4A5724; --olive-line: #55602E;
  --orange: #FF7A1A; --mustard: #F2C14E; --mint: #7FE0C8;
  --text: #F4E4BC; --text-dim: #E2D3A4; --text-mute: #BFB27E;
  --line: 6px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--olive); color: var(--text); font-family: 'Chakra Petch', system-ui, sans-serif; }
button, select, textarea, input { font-family: inherit; }
.app { min-height: 100vh; display: flex; flex-wrap: wrap; border: var(--line) solid var(--orange); }
.cut { clip-path: polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px); }
.cut-in { clip-path: polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px); }
.cut-sm { clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
.hidden { display: none !important; }

/* zijbalk */
aside { flex: 1 1 280px; max-width: 100%; padding: 26px 24px; background: var(--olive-deep);
  border-right: var(--line) solid var(--orange); display: flex; flex-direction: column; gap: 26px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand b { display: block; font-size: 30px; letter-spacing: 3px; line-height: 1; }
.brand b i { font-style: normal; color: var(--orange); }
.brand small { display: block; font-size: 13px; color: var(--mustard); letter-spacing: 2px; margin-top: 4px; }
.new { width: 100%; min-height: 52px; background: var(--orange); color: var(--olive-deep); border: 0;
  font-size: 17px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.new:hover { background: var(--mustard); }
.label { font-size: 13px; letter-spacing: 2px; color: var(--mustard); font-weight: 600; }
nav { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow-y: auto; max-height: 36vh; }
nav button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 44px; text-align: left; width: 100%;
  background: transparent; border: 0; border-left: var(--line) solid transparent; color: var(--text-dim); font-size: 16px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav button.on { background: var(--olive); border-left-color: var(--orange); color: var(--text); }
nav button:hover { color: var(--text); }
.settings { display: flex; flex-direction: column; gap: 18px; margin-top: auto; padding-top: 22px; border-top: 4px solid var(--orange); }
.settings label { display: flex; flex-direction: column; gap: 8px; font-size: 14px; letter-spacing: 1px; color: var(--mustard); font-weight: 600; }
select { min-height: 44px; background: var(--olive); color: var(--text); border: 4px solid var(--orange); border-radius: 0; font-size: 16px; padding: 0 10px; }
input[type=range] { accent-color: var(--orange); }
.check { flex-direction: row !important; align-items: center; gap: 12px !important; min-height: 44px; color: var(--text) !important; font-weight: 500 !important; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--orange); }
.linkbtn { background: none; border: 0; color: var(--text-mute); font-size: 14px; text-align: left; padding: 8px 0; min-height: 44px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.linkbtn:hover { color: var(--text); }

/* gesprek */
main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 36px; border-bottom: var(--line) solid var(--orange); }
h1 { margin: 0; font-size: 30px; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
.status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--mint); letter-spacing: 1px; font-weight: 600; padding: 6px 0; }
.status.busy-pill { color: var(--olive-deep); background: var(--orange); padding: 6px 12px; }
.status.busy-pill svg path { fill: var(--olive-deep); }
#log { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 30px; padding: 32px 36px; }
.msg { display: flex; gap: 14px; align-items: flex-start; }
.msg.me { justify-content: flex-end; }
.avatar { flex: 0 0 auto; }
.bubble-me { background: var(--mustard); padding: 4px; max-width: 620px; min-width: 0; }
.bubble-me > div { background: var(--olive-soft); padding: 16px 20px; }
.bot { display: flex; flex-direction: column; gap: 12px; max-width: 780px; min-width: 0; flex: 1 1 auto; }
.bubble-bot { background: var(--orange); padding: 6px; }
.bubble-bot.claude { background: var(--mint); }
.bubble-bot > div { background: var(--olive-deep); padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; letter-spacing: 2px; color: var(--mustard); font-weight: 600; }
.claude .meta { color: var(--mint); }
pre { margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.6; color: var(--text); white-space: pre-wrap; overflow-x: auto; }
.md { font-size: 17px; line-height: 1.55; overflow-wrap: anywhere; }
.md p { margin: 0 0 10px; } .md p:last-child { margin-bottom: 0; }
.md h3 { margin: 14px 0 8px; color: var(--mustard); letter-spacing: 1px; font-size: 19px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 24px; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--orange); }
.md code { font-family: 'JetBrains Mono', monospace; font-size: 14px; background: var(--olive-soft); padding: 1px 6px; color: var(--mustard); }
.md pre { background: #252D10; border-left: 5px solid var(--orange); padding: 12px 14px; margin: 6px 0 12px; font-size: 14px; }
.md pre code { background: none; padding: 0; color: var(--text); }
.md strong { color: #FFF1CC; }
.md a { color: var(--mint); }
.caret { display: inline-block; width: 10px; height: 18px; background: var(--mint); vertical-align: -3px; animation: blink .8s infinite steps(2); }
.icon-btn { width: 44px; height: 44px; background: transparent; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.icon-btn:hover svg path { stroke: var(--mustard); }
.err { color: var(--mustard); }
.foot { font-size: 13px; color: var(--text-mute); letter-spacing: 1px; }
.foot:empty { display: none; }
.levels { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; }
.levels:empty { display: none; }
.levels .cap { font-size: 13px; letter-spacing: 1px; color: var(--text-mute); margin-right: 6px; align-self: center; }
.levels button { width: 26px; border: 0; padding: 0; cursor: pointer; }
.levels button.sel { outline: 3px solid var(--text); outline-offset: 2px; }
.levels .ms { font-size: 13px; color: var(--text-mute); margin-left: 6px; align-self: center; }
.level-view { border-left: var(--line) solid var(--mint); padding: 10px 16px; background: var(--olive-deep); }
.level-view .label { color: var(--mint); display: block; margin-bottom: 8px; }

.busy { background: var(--orange); padding: 6px; max-width: 520px; }
.busy > div { background: var(--olive-deep); padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.busy .head { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
.busy .blink { width: 14px; height: 14px; background: var(--orange); animation: blink .8s infinite steps(2); }
.busy .sub { font-size: 15px; color: var(--text-dim); }
.busy .bars { display: flex; align-items: flex-end; gap: 6px; height: 48px; }
.busy .bars span { width: 26px; background: var(--olive-line); transition: background .15s; }
.busy .bars span.on { background: var(--c); }
.busy .bars.loading span { animation: wave 1.1s infinite steps(5); background: var(--c); }
.busy .time { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--mint); }
@keyframes blink { 50% { opacity: 0; } }
@keyframes wave { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .busy .blink, .busy .bars.loading span, .caret { animation: none; } }

.empty { margin: auto; max-width: 560px; text-align: center; color: var(--text-dim); font-size: 18px; line-height: 1.5; }
.empty b { color: var(--orange); }
.keycard { background: var(--mint); padding: 5px; max-width: 560px; align-self: center; width: 100%; margin: auto 0; }
.keycard > div { background: var(--olive-deep); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.keycard h2 { margin: 0; font-size: 20px; letter-spacing: 2px; color: var(--mint); }
.keycard p { margin: 0; color: var(--text-dim); line-height: 1.5; }
.keycard .row { display: flex; gap: 10px; flex-wrap: wrap; }
.keycard input { flex: 1 1 260px; min-height: 48px; background: var(--olive); color: var(--text); border: 4px solid var(--mint); border-radius: 0; padding: 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
.keycard button { min-height: 48px; padding: 0 20px; background: var(--mint); color: var(--olive-deep); border: 0; font-weight: 700; letter-spacing: 1px; font-size: 15px; cursor: pointer; }
.keycard .msgline { color: var(--mustard); min-height: 1em; }

form { padding: 22px 36px 30px; border-top: var(--line) solid var(--orange); display: flex; gap: 14px; align-items: stretch; }
.field { flex: 1 1 auto; min-width: 0; background: var(--orange); padding: 5px; }
textarea { display: block; width: 100%; resize: none; background: var(--olive-deep); color: var(--text); border: 0; padding: 14px 18px;
  font-family: 'JetBrains Mono', monospace; font-size: 15px; outline: none; min-height: 64px; }
textarea::placeholder { color: var(--text-mute); }
textarea:disabled { opacity: .6; }
.send { flex: 0 0 76px; min-height: 64px; background: var(--orange); border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.send:hover { background: var(--mustard); }
.send:disabled { opacity: .6; cursor: wait; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
@media (max-width: 860px) {
  main { height: auto; min-height: 100vh; }
  aside { border-right: 0; border-bottom: var(--line) solid var(--orange); padding: 20px 16px; }
  header, #log, form { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <!-- logo: periodiek-systeemtegel van kwik (80, Hg) met gefacetteerde druppel -->
      <svg width="60" height="60" viewBox="0 0 60 60" role="img" aria-label="HyGra-logo">
        <path d="M10 3 L57 3 L57 50 L50 57 L3 57 L3 10 Z" fill="#2E3714" stroke="#FF7A1A" stroke-width="5"/>
        <text x="10" y="17" font-family="Chakra Petch, sans-serif" font-size="10" font-weight="700" fill="#F2C14E">80</text>
        <path d="M45 9 L50 16 L47 20 L43 20 L40 16 Z" fill="#7FE0C8"/>
        <path d="M45 9 L45 20" stroke="#2E3714" stroke-width="1.5"/>
        <text x="9" y="47" font-family="Chakra Petch, sans-serif" font-size="27" font-weight="700" fill="#F4E4BC">Hg</text>
      </svg>
      <div><b><i>H</i>Y<i>G</i>RA</b><small>HYDRARGYRUM</small></div>
    </div>
    <div class="cut-sm" style="background:var(--orange)">
      <button class="new" id="new">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 1 L11 21 M1 11 L21 11 M4 4 L18 18 M18 4 L4 18" stroke="#2E3714" stroke-width="3" stroke-linecap="square"/></svg>
        NIEUW GESPREK
      </button>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;min-height:0">
      <span class="label">EERDER</span>
      <nav aria-label="Gesprekken" id="history"></nav>
    </div>
    <div class="settings">
      <label>MODEL
        <select id="model">
          <option value="claude">Claude Opus 5.5 · cloud</option>
          <option value="qwen">Qwen-NCM · 0.5B · lokaal</option>
          <option value="ncm">NCM · 34M · lokaal</option>
        </select>
      </label>
      <div id="local-opts" style="display:flex;flex-direction:column;gap:18px">
        <label>
          <span style="display:flex;align-items:center;gap:8px">
            <svg width="16" height="20" viewBox="0 0 16 20" aria-hidden="true"><path d="M8 1 L13 8 L9 9 L14 19 L3 10 L7 9 Z" fill="#FF7A1A"/></svg>
            TEMPERATUUR · <span id="tval">0.6</span>
          </span>
          <input type="range" id="temp" min="0" max="1.5" step="0.1" value="0.6">
        </label>
        <label>
          <span style="display:flex;align-items:center;gap:8px">
            <svg width="20" height="16" viewBox="0 0 20 16" aria-hidden="true"><path d="M1 3 L19 3 M1 8 L19 8 M1 13 L12 13" stroke="#F2C14E" stroke-width="3"/></svg>
            LENGTE · <span id="cval">2</span> CHUNKS
          </span>
          <input type="range" id="chunks" min="1" max="4" step="1" value="2">
        </label>
        <label class="check">
          <input type="checkbox" id="showlv" checked>
          <svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><path d="M1 17 L1 12 L7 12 L7 7 L13 7 L13 2 L21 2" stroke="#7FE0C8" stroke-width="3" fill="none"/></svg>
          Toon de 9 niveaus
        </label>
      </div>
      <button class="linkbtn" id="keybtn" type="button">
        <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M2 2 L10 2 L10 12 L2 12 Z M10 7 L21 7 M17 7 L17 12 M20 7 L20 11" stroke="#7FE0C8" stroke-width="3" fill="none"/></svg>
        API-sleutel voor Claude wijzigen
      </button>
    </div>
  </aside>

  <main>
    <header>
      <h1 id="title">Nieuw gesprek</h1>
      <span class="status" id="status">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0 L14 7 L7 14 L0 7 Z" fill="#7FE0C8"/></svg>
        <span id="status-text">OPSTARTEN</span>
      </span>
    </header>
    <section id="log" aria-label="Berichten" aria-live="polite"></section>
    <form id="form">
      <label for="prompt" class="sr">Bericht</label>
      <div class="field cut"><textarea id="prompt" class="cut-in" rows="2"></textarea></div>
      <button type="submit" class="send cut" id="send" aria-label="Verstuur">
        <svg class="i-send" width="34" height="30" viewBox="0 0 34 30" aria-hidden="true"><path d="M1 1 L33 15 L1 29 L9 15 Z" fill="#2E3714"/><path d="M9 15 L22 15" stroke="#F2C14E" stroke-width="3"/></svg>
        <svg class="i-wait" width="28" height="34" viewBox="0 0 28 34" aria-hidden="true" style="display:none"><path d="M2 2 L26 2 L14 17 L26 32 L2 32 L14 17 Z" fill="none" stroke="#2E3714" stroke-width="4"/><path d="M8 28 L20 28 L14 21 Z" fill="#2E3714"/></svg>
      </button>
    </form>
  </main>
</div>

<template id="t-me">
  <div class="msg me">
    <div class="bubble-me cut"><div class="cut-in"><pre></pre></div></div>
    <svg class="avatar" width="40" height="44" viewBox="0 0 40 44" role="img" aria-label="Jij">
      <path d="M20 2 L37 12 L37 32 L20 42 L3 32 L3 12 Z" fill="none" stroke="#F2C14E" stroke-width="4"/>
      <path d="M12 26 L20 16 L28 26" fill="none" stroke="#F2C14E" stroke-width="4"/>
    </svg>
  </div>
</template>
<template id="t-avatar-claude">
  <!-- Claude: een vonk uit hoekige stralen -->
  <svg class="avatar" width="40" height="44" viewBox="0 0 40 44" role="img" aria-label="Claude">
    <path d="M20 3 L23 18 L37 22 L23 26 L20 41 L17 26 L3 22 L17 18 Z" fill="#7FE0C8"/>
    <path d="M9 11 L18 20 M31 11 L22 20 M9 33 L18 24 M31 33 L22 24" stroke="#7FE0C8" stroke-width="3"/>
  </svg>
</template>
<template id="t-avatar-ncm">
  <svg class="avatar" width="40" height="44" viewBox="0 0 40 44" role="img" aria-label="NCM">
    <path d="M20 2 L38 22 L20 42 L2 22 Z" fill="#FF7A1A"/>
    <rect x="12" y="15" width="16" height="3" fill="#2E3714"/><rect x="12" y="20" width="7" height="3" fill="#2E3714"/>
    <rect x="21" y="20" width="7" height="3" fill="#2E3714"/><rect x="12" y="25" width="3" height="3" fill="#2E3714"/>
    <rect x="17" y="25" width="3" height="3" fill="#2E3714"/><rect x="21" y="25" width="3" height="3" fill="#2E3714"/>
    <rect x="25" y="25" width="3" height="3" fill="#2E3714"/>
  </svg>
</template>
<template id="t-bot">
  <div class="msg">
    <span class="av"></span>
    <div class="bot">
      <div class="bubble-bot cut"><div class="cut-in">
        <div class="meta"><span class="what"></span>
          <button class="icon-btn copy" aria-label="Kopieer">
            <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M6 1 L21 1 L17 15 L2 15 Z" fill="none" stroke="#7FE0C8" stroke-width="3"/><path d="M5 20 L18 20" stroke="#7FE0C8" stroke-width="3"/></svg>
          </button>
        </div>
        <div class="body"></div>
      </div></div>
      <div class="foot"></div>
      <div class="levels"></div>
      <div class="level-view" hidden><span class="label"></span><pre></pre></div>
    </div>
  </div>
</template>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ["#FF7A1A", "#FF7A1A", "#F2C14E", "#F2C14E", "#F2C14E", "#7FE0C8", "#7FE0C8", "#7FE0C8", "#7FE0C8"];
const NAMES = ["1 code", "2", "4", "8", "16", "32", "48", "64", "64 codes"];
const MODEL_LABEL = { claude: "CLAUDE OPUS 5.5", qwen: "QWEN-NCM", ncm: "NCM 34M" };
let chats = loadChats(), current = null, deviceName = "", hasKey = false;

function loadChats() { try { return JSON.parse(localStorage.getItem("hygra-chats")) || []; } catch { return []; } }
function save() { try { localStorage.setItem("hygra-chats", JSON.stringify(chats.slice(0, 40))); } catch {} }
function titleOf(text) {
  const m = text.match(/(?:def|class)\s+(\w+)/);
  return m ? m[1] : text.trim().split("\n")[0].slice(0, 36) || "gesprek";
}
function api() {
  if (!window.pywebview || !window.pywebview.api) throw new Error("open dit via de app (app.py), niet in een browser");
  return window.pywebview.api;
}
function setStatus(text) { $("status-text").textContent = text; }
function isClaude() { return $("model").value === "claude"; }

/* --- kleine, veilige Markdown-weergave (alles wordt eerst ge-escaped) --- */
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function markdown(src) {
  const out = [], lines = src.replace(/\r/g, "").split("\n");
  let i = 0, para = [], list = null;
  const flushPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push("<" + list.tag + ">" + list.items.map((x) => "<li>" + inline(x) + "</li>").join("") + "</" + list.tag + ">"); list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      flushPara(); flushList();
      const code = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) code.push(lines[i++]);
      out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); i++; continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    const ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push("<h3>" + inline(h[2]) + "</h3>"); }
    else if (ul || ol) {
      flushPara();
      const tag = ul ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((ul || ol)[1]);
    } else if (!l.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(l); }
    i++;
  }
  flushPara(); flushList();
  return out.join("");
}

/* --- geschiedenis --- */
function renderHistory() {
  const box = $("history"); box.replaceChildren();
  chats.forEach((c) => {
    const b = document.createElement("button");
    b.className = c === current ? "on" : "";
    b.innerHTML = '<svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true" style="flex:0 0 auto"><path d="M1 12 L6 3 L10 10 L17 1" stroke="' + (c === current ? "#FF7A1A" : "#BFB27E") + '" stroke-width="3" fill="none"/></svg>';
    b.append(document.createTextNode(c.title));
    b.onclick = () => { if (!busy) { current = c; renderAll(); } };
    box.append(b);
  });
}

function renderAll() {
  $("title").textContent = current ? current.title : "Nieuw gesprek";
  $("log").replaceChildren();
  if (!current || !current.turns.length) renderEmpty();
  else current.turns.forEach((t) => { addMe(t.prompt); addBot(t); });
  renderHistory();
}

function renderEmpty() {
  if (isClaude() && !hasKey) return showKeyCard();
  const p = document.createElement("p"); p.className = "empty";
  p.innerHTML = isClaude()
    ? 'Stel <b>Claude Opus 5.5</b> gelijk welke vraag: uitleg, code, tekst, vertalingen…<br>Enter = versturen, Shift+Enter = nieuwe regel.'
    : 'Typ het <b>begin van wat Python</b>, bv. <code>def is_priem(n):</code>. Het NCM-model schrijft per stuk van 128 tokens verder, telkens in <b>9 stappen van grof naar fijn</b>. (Experimenteel: verwacht vooral rommel.)';
  $("log").append(p);
}

function showKeyCard() {
  const card = document.createElement("div"); card.className = "keycard cut";
  card.innerHTML = '<div class="cut-in"><h2>API-SLEUTEL NODIG</h2>' +
    '<p>Voor Claude heeft HyGra een Anthropic API-sleutel nodig (console.anthropic.com → API keys). Die wordt veilig bewaard in Windows Credential Manager, nooit in een bestand. Elk bericht kost een klein bedrag; HyGra toont de kost bij elk antwoord.</p>' +
    '<div class="row"><label class="sr" for="keyin">API-sleutel</label><input id="keyin" type="password" placeholder="sk-ant-…" autocomplete="off"><button type="button" id="keysave">BEWAAR</button></div>' +
    '<span class="msgline" id="keymsg"></span></div>';
  $("log").replaceChildren(card);
  const go = async () => {
    const k = $("keyin").value.trim(); if (!k) return;
    $("keymsg").textContent = "Controleren…";
    const r = await api().save_key(k);
    if (r.error) { $("keymsg").textContent = r.error; return; }
    hasKey = true; renderAll(); setStatus("KLAAR · CLAUDE");
  };
  $("keysave").onclick = go;
  $("keyin").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  $("keyin").focus();
}

/* --- berichten --- */
function addMe(text) {
  const n = $("t-me").content.cloneNode(true);
  n.querySelector("pre").textContent = text;
  $("log").append(n); scrollDown();
}

function botNode(model) {
  const n = $("t-bot").content.firstElementChild.cloneNode(true);
  n.querySelector(".av").replaceWith($(model === "claude" ? "t-avatar-claude" : "t-avatar-ncm").content.cloneNode(true));
  if (model === "claude") n.querySelector(".bubble-bot").classList.add("claude");
  return n;
}

function fillBot(n, t) {
  const body = n.querySelector(".body");
  if (t.error) { body.className = "body"; body.innerHTML = '<pre class="err"></pre>'; body.firstChild.textContent = "Fout: " + t.error; }
  else if (t.model === "claude") { body.className = "body md"; body.innerHTML = markdown(t.text || ""); }
  else { body.innerHTML = "<pre></pre>"; body.firstChild.textContent = t.completion || "(niets gegenereerd)"; }
  n.querySelector(".what").textContent = t.model === "claude" ? "CLAUDE OPUS 5.5"
    : MODEL_LABEL[t.model] + " · " + (t.chunks || 0) + " CHUNK" + (t.chunks === 1 ? "" : "S") + " · 9 STAPPEN ELK";
  n.querySelector(".copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(t.model === "claude" ? (t.text || "") : t.prompt + (t.completion || ""));
  const foot = n.querySelector(".foot");
  foot.textContent = t.model === "claude" && t.cost != null
    ? (t.tokens_in || 0).toLocaleString("nl-BE") + " → " + (t.tokens_out || 0).toLocaleString("nl-BE") + " tokens · ± $" + t.cost.toFixed(4).replace(".", ",") + " · " + (t.seconds || 0).toFixed(1).replace(".", ",") + " s"
    : "";
  const lv = n.querySelector(".levels"), view = n.querySelector(".level-view");
  lv.replaceChildren();
  if (t.model !== "claude" && t.levels && t.levels.length && $("showlv").checked) {
    const cap = document.createElement("span"); cap.className = "cap"; cap.textContent = "grof → fijn"; lv.append(cap);
    t.levels.forEach((txt, k) => {
      const b = document.createElement("button");
      b.style.height = (12 + k * 4) + "px"; b.style.background = COLORS[k];
      b.setAttribute("aria-label", "Toon niveau " + k);
      b.onclick = () => {
        const same = !view.hidden && view.dataset.k == k;
        lv.querySelectorAll("button").forEach((x) => x.classList.remove("sel"));
        view.hidden = same;
        if (!same) { b.classList.add("sel"); view.dataset.k = k;
          view.querySelector(".label").textContent = "NIVEAU " + k + " · " + NAMES[k] + " — de laatste chunk zoals het model hem op dit niveau 'ziet'";
          view.querySelector("pre").textContent = txt; }
      };
      lv.append(b);
    });
    const ms = document.createElement("span"); ms.className = "ms"; ms.textContent = t.ms + " ms"; lv.append(ms);
  }
}

function addBot(t) { const n = botNode(t.model); fillBot(n, t); $("log").append(n); scrollDown(); }
function scrollDown() { const l = $("log"); l.scrollTop = l.scrollHeight; }

/* --- bezig-indicator --- */
let busy = false, busyCard = null, busyTimer = null, busyStart = 0, live = null;
function setBusy(on, kind) {
  busy = on;
  $("send").disabled = on; $("prompt").disabled = on; $("model").disabled = on;
  $("send").querySelector(".i-send").style.display = on ? "none" : "";
  $("send").querySelector(".i-wait").style.display = on ? "" : "none";
  $("status").classList.toggle("busy-pill", on);
  clearInterval(busyTimer);
  if (busyCard) busyCard.remove();
  busyCard = null;
  if (!on) return;
  setStatus(kind === "load" ? "MODEL LADEN" : kind === "claude" ? "DENKT NA" : "BEZIG");
  busyStart = Date.now();
  busyTimer = setInterval(tickClock, 100);
  if (kind === "claude") return;     // Claude toont zijn voortgang in de antwoordbel zelf
  busyCard = document.createElement("div"); busyCard.className = "msg";
  busyCard.innerHTML = '<div class="busy cut" role="status"><div class="cut-in"><div class="head"><span class="blink"></span><span class="t"></span></div><div class="sub"></div><div class="bars"></div><div class="time">0,0 s</div></div></div>';
  const bars = busyCard.querySelector(".bars");
  COLORS.forEach((c, k) => { const b = document.createElement("span"); b.style.height = (12 + k * 4) + "px"; b.style.setProperty("--c", c); b.style.animationDelay = (k * .1) + "s"; bars.append(b); });
  if (kind === "load") {
    bars.classList.add("loading");
    busyCard.querySelector(".t").textContent = "MODEL LADEN";
    busyCard.querySelector(".sub").textContent = "Het model gaat naar de GPU. De eerste keer duurt dit even (±10–30 s).";
  } else {
    busyCard.querySelector(".t").textContent = "BEZIG MET SCHRIJVEN";
    busyCard.querySelector(".sub").textContent = "Grove schets eerst, details daarna…";
  }
  $("log").append(busyCard); scrollDown();
}
function tickClock() {
  const s = ((Date.now() - busyStart) / 1000).toFixed(1).replace(".", ",") + " s";
  if (busyCard) busyCard.querySelector(".time").textContent = s;
  if (live) live.foot.textContent = live.state + " · " + s;
}
window.progress = (c, k, n) => {   // vanuit Python na elk niveau
  if (!busyCard) return;
  busyCard.querySelector(".sub").textContent = "Chunk " + (c + 1) + " van " + n + " · niveau " + (k + 1) + " van 9 klaar";
  busyCard.querySelectorAll(".bars span").forEach((b, i) => b.classList.toggle("on", i <= k));
};

/* --- Claude-streaming (vanuit Python) --- */
window.hygra = {
  delta(id, text) {
    if (!live || live.id !== id) return;
    live.text += text; live.state = "SCHRIJFT"; setStatus("SCHRIJFT");
    live.body.innerHTML = markdown(live.text) + '<span class="caret"></span>';
    scrollDown();
  },
  status(id, s) {
    if (!live || live.id !== id) return;
    live.state = s === "denkt na" ? "DENKT NA" : "SCHRIJFT";
    setStatus(live.state);
  },
};

function claudeHistory(prompt) {
  const msgs = [];
  for (const t of current.turns) {
    if (t.model !== "claude" || !t.raw || t.error) continue;   // alleen geslaagde Claude-beurten, ongewijzigd
    msgs.push({ role: "user", content: t.prompt });
    msgs.push({ role: "assistant", content: t.raw });
  }
  msgs.push({ role: "user", content: prompt });
  return msgs;
}

async function send(e) {
  e.preventDefault();
  const prompt = $("prompt").value;
  if (!prompt.trim() || busy) return;
  const model = $("model").value;
  if (model === "claude" && !hasKey) return showKeyCard();
  if (!current) { current = { title: titleOf(prompt), turns: [] }; chats.unshift(current); renderHistory(); }
  if (!current.turns.length) $("log").replaceChildren();
  $("title").textContent = current.title;
  addMe(prompt); $("prompt").value = "";
  let turn;
  if (model === "claude") {
    const id = "m" + Date.now();
    const n = botNode("claude");
    n.querySelector(".what").textContent = "CLAUDE OPUS 5.5";
    const body = n.querySelector(".body"); body.className = "body md"; body.innerHTML = '<span class="caret"></span>';
    $("log").append(n); scrollDown();
    live = { id, body, foot: n.querySelector(".foot"), text: "", state: "DENKT NA" };
    const history = claudeHistory(prompt);
    setBusy(true, "claude");
    const t0 = Date.now();
    try {
      const r = await api().claude(history, id);
      if (r.error === "nokey") { hasKey = false; r.error = "API-sleutel ontbreekt of is ongeldig. Klik links op 'API-sleutel voor Claude wijzigen'."; }
      turn = { prompt, model, ...r, seconds: (Date.now() - t0) / 1000 };
    } catch (err) { turn = { prompt, model, error: String(err) }; }
    live = null; setBusy(false);
    fillBot(n, turn);
  } else {
    setBusy(true, "write");
    try {
      const j = await api().complete(prompt, model, +$("temp").value, +$("chunks").value);
      turn = j.error ? { prompt, model, error: j.error } : { prompt, model, ...j };
    } catch (err) { turn = { prompt, model, error: String(err) }; }
    setBusy(false);
    addBot(turn);
  }
  setStatus("KLAAR · " + (model === "claude" ? "CLAUDE" : deviceName));
  current.turns.push(turn); save(); renderHistory();
  $("prompt").focus();
}

function applyModel() {
  $("local-opts").classList.toggle("hidden", isClaude());
  $("prompt").placeholder = isClaude()
    ? "Vraag Claude iets…  (Enter = versturen, Shift+Enter = nieuwe regel)"
    : "Typ het begin van een functie…  (Enter = versturen, Shift+Enter = nieuwe regel)";
}

async function warm() {
  applyModel();
  if (!current || !current.turns.length) renderAll();
  if (isClaude()) { setStatus(hasKey ? "KLAAR · CLAUDE" : "SLEUTEL NODIG"); return; }
  setBusy(true, "load");
  let ok = true;
  try { await api().warmup($("model").value); } catch (err) { ok = false; }
  setBusy(false); setStatus(ok ? "KLAAR · " + deviceName : "FOUT BIJ LADEN");
}

window.addEventListener("pywebviewready", async () => {
  const info = await api().info();
  deviceName = info.device.replace("NVIDIA GeForce ", "").replace(" Laptop GPU", "").toUpperCase();
  hasKey = await api().has_key();
  [...$("model").options].forEach((o) => { if (o.value !== "claude" && !info.models.includes(o.value)) o.remove(); });
  warm();
});
$("model").onchange = warm;
$("form").onsubmit = send;
$("prompt").addEventListener("keydown", (e) => {   // Enter = versturen, Shift+Enter = nieuwe regel
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) send(e);
});
$("new").onclick = () => { if (busy) return; current = null; renderAll(); $("prompt").focus(); };
$("keybtn").onclick = () => { if (!busy) { current = null; renderHistory(); showKeyCard(); } };
$("temp").oninput = () => $("tval").textContent = (+$("temp").value).toFixed(1);
$("chunks").oninput = () => $("cval").textContent = $("chunks").value;
$("showlv").onchange = renderAll;
applyModel();
renderAll();
</script>
</body>
</html>
