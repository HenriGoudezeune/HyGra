/* --- Claude-streaming (vanuit Python) --- */
const htmlNodes = (html) => { const t = document.createElement("template"); t.innerHTML = html; return [...t.content.childNodes]; };
const detailsIn = (nodes) => nodes.flatMap((n) => n.nodeType !== 1 ? [] : n.matches("details") ? [n, ...n.querySelectorAll("details")] : [...n.querySelectorAll("details")]);
function scheduleDraw(j) { if (!j.raf) j.raf = requestAnimationFrame(() => drawJob(j)); }
// streaming: finished blocks are drawn once; only the block Claude is still writing is redrawn, at most once per frame
function drawJob(j) {
  j.raf = 0;
  if (!claudeJobs.has(j.id) || j.stopping || !j.node.isConnected) return;   // not on screen: catches up when it is
  const stick = $("log").scrollHeight - $("log").scrollTop - $("log").clientHeight < 120;
  if (j.cut == null) { j.cut = 0; j.live = []; j.body.replaceChildren(); }
  const open = detailsIn(j.live).map((d) => d.open);   // keep the blocks you opened open while the text is redrawn
  j.live.forEach((n) => n.remove());
  const rest = j.text.slice(j.cut);
  let toks = []; try { toks = marked.lexer(rest); } catch {}
  // all blocks but the last are complete; cut only after a blank line, where nothing can still join the block before
  let k = toks.length - 1; while (k > 0 && toks[k].type === "space") k--;
  let ready = "", acc = "";
  for (let i = 0; i < k; i++) { acc += toks[i].raw; if (acc.endsWith("\n\n")) ready = acc; }
  let fresh = [];
  if (ready && rest.startsWith(ready)) {
    fresh = htmlNodes(markdown(ready));
    j.body.append(...fresh); j.cut += ready.length;
  }
  j.live = htmlNodes(markdown(j.text.slice(j.cut)) + '<span class="caret"></span>');
  j.body.append(...j.live);
  detailsIn(fresh.concat(j.live)).forEach((d, i) => { if (open[i]) d.open = true; });
  nestTools(j.body);
  j.body.querySelectorAll("details.tool:not(.done)").forEach((d) => d.classList.add("run"));
  fresh.forEach((n) => n.nodeType === 1 && linkFiles(n, j.chat.cwd));
  if (stick) scrollDown();
}
const settled = new Map();   // bericht-id → afgewerkte job, voor wat Claude Code na het einde nog stuurt
window.hygra = {
  delta(id, text) {
    const j = claudeJobs.get(id);
    if (!j || j.stopping) return;
    j.text += text.replace(/\r/g, "");
    for (const m of text.matchAll(/\u2063me (.*)/g)) { try { (j.taken ||= new Set()).add(JSON.parse(m[1]).u); } catch {} }
    if (j.taken && j.queued && j.queued.length) drawQueue(j);
    const tm = /\u2063tool ([^\s·]+)/.exec(text);   // which tool, in the status: WERKT · BASH
    if (tm) j.state = "WERKT · " + tm[1].replace(/^mcp__.*__/, "").toUpperCase();
    else if (!/^\n*\u2063/.test(text)) j.state = "SCHRIJFT";
    if (j.chat === current) refreshUi();
    scheduleDraw(j);
  },
  status(id, s) {
    const j = claudeJobs.get(id);
    if (!j || j.stopping) return;
    j.state = s === "denkt na" ? thinkWord(j) : s === "werkt" ? "WERKT" : "SCHRIJFT"; refreshUi();
  },
  // after the reply was already done: usage, and rarely more text (Claude went on after a background task)
  late(id, x) {
    if (x.limits) renderUsage(x.limits);
    if (!x.text) return;
    const j = claudeJobs.get(id);
    if (j) { j.lateText = (j.lateText || "") + x.text; return; }
    const s = settled.get(id);
    if (!s || s.turn.stopped || s.turn.error) return;
    s.turn.text = (s.turn.text || "") + x.text;
    if (s.node.isConnected) fillBot(s.node, s.turn, s.chat.cwd);
    if (chats.includes(s.chat)) save();
  },
};

function newSessionId() {
  return crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}

async function send(e) {
  e.preventDefault();
  const prompt = $("prompt").value, model = $("model").value;
  const busy = viewJob();
  if (busy) {
    if (busy.kind === "claude" && prompt.trim()) { if (!busy.stopping) { $("prompt").value = ""; steer(busy, prompt); refreshUi(); } }
    else if (e.type === "submit") stopJob(busy);   // zonder tekst is de knop een stopknop; Enter doet dan niets
    return;
  }
  if (!prompt.trim()) return;
  if (model === "claude" && !hasClaude) return showNoClaude();
  if (current && (current.loading || (current.ext && (current.source !== "code" || model !== "claude")))) current = null;   // Cowork kan je alleen lezen
  if (!current) { current = { title: titleOf(prompt), turns: [] }; chats.unshift(current); }
  $("prompt").value = "";
  ask(current, prompt, model);
}

async function ask(chat, prompt, model) {
  const lane = laneOf(model);
  chat.updated = Date.now();
  const turn = { prompt, model }, t0 = Date.now();
  const job = model === "claude" ? claudeJob(chat, turn, "m" + t0, t0) : { kind: "write", id: "g" + t0, model, chat, turn, t0, state: "BEZIG", node: busyCard("write") };
  turn.pending = job; chat.turns.push(turn);
  startJob(job);
  if (chat === current) renderAll(); else renderHistory();
  let r;
  try {
    if (model === "claude") {
      // één Claude Code-sessie per HyGra-gesprek; die onthoudt het gesprek zelf
      const first = !chat.claudeSession;
      if (first) chat.claudeSession = await api().claude_spare().catch(() => newSessionId());
      if (chats.includes(chat)) save();   // het lopende antwoord overleeft zo het sluiten van de app
      r = await api().claude(chat.claudeSession, first, prompt, job.id, chat.cwd || null);
    } else {
      r = await api().complete(prompt, model, +$("temp").value, +$("chunks").value, job.id);
      if (!r.error) { onGpu = model; failed.delete(model); }
    }
  } catch (err) { r = { error: String(err) }; }
  await settle(job, r);
  if (model === "claude") loadExternal();   // een verdergezet Code-gesprek schuift naar boven
  if (lane === "gpu") warm();
}

function claudeJob(chat, turn, id, t0) {
  const job = { kind: "claude", id, model: "claude", chat, turn, t0, text: "" };
  job.state = thinkWord(job);
  job.node = botNode("claude");
  job.node.querySelector(".what").textContent = "CLAUDE OPUS 5.5";
  job.body = job.node.querySelector(".body"); job.body.className = "body md"; job.body.innerHTML = '<span class="caret"></span>';
  job.foot = job.node.querySelector(".foot");
  return job;
}

// een taak is klaar: het resultaat in de beurt zetten, tonen en bewaren
async function settle(job, r) {
  const { chat, turn } = job;
  if (job.kind === "claude") {
    if ((r.error || r.stopped) && chat.claudeSession && !(await api().has_session(chat.claudeSession).catch(() => true))) delete chat.claudeSession;   // de sessie is nooit gestart
    if (r.stopped) r.text = job.text;   // wat er al stond, blijft staan
  }
  delete turn.pending;
  if (job.raf) { cancelAnimationFrame(job.raf); job.raf = 0; }
  if (job.lateText && r.text != null) r.text += job.lateText;
  if (r.limits) renderUsage(r.limits);
  delete r.limits;
  Object.assign(turn, r, { seconds: (Date.now() - job.t0) / 1000 });
  endJob(job);
  if (!r.stopped) api().flash().catch(() => {});   // taakbalkknop knippert als HyGra niet vooraan staat
  if (job.kind === "claude") {   // ook als het gesprek niet open staat: de node blijft voor later bewaard
    fillBot(job.node, turn, chat.cwd); botCache.set(turn, job.node);
    settled.set(job.id, { turn, chat, node: job.node });
    setTimeout(() => settled.delete(job.id), 120000);
  }
  if (job.node.isConnected) {
    if (job.kind !== "claude") { const n = botNode(job.model); fillBot(n, turn); job.node.replaceWith(n); }
    scrollDown(false);
  }
  if (chats.includes(chat)) { save(); renderHistory(); }
  if (job.kind === "claude") {
    api().claude_done(job.id).catch(() => {});   // bewaard: de jobmap mag weg
    job.settled = true; job.queued = []; drawQueue(job);
    if (r.stopped || r.error) putBack(job, job.after || []); else sendAfter(job);
  }
}

// na een herstart: Claude-antwoorden die doorliepen terwijl HyGra dicht was, opnieuw volgen (of het resultaat ophalen)
function resumeClaude() {
  for (const chat of chats) for (const turn of chat.turns) {
    if (!turn.running) continue;
    const job = claudeJob(chat, turn, turn.running, turn.t0 || Date.now());
    delete turn.running; delete turn.t0;
    turn.pending = job;
    startJob(job);
    api().claude_attach(job.id).catch((err) => ({ error: String(err) })).then((r) => settle(job, r));
  }
  renderAll();
}

function applyModel() {
  $("local-opts").classList.toggle("hidden", isClaude());
  const ext = current && current.ext;
  $("prompt").placeholder = ext && current.source === "cowork" ? "Alleen lezen — typ om een nieuw gesprek te starten"
    : ext && isClaude() ? "Ga verder…"
    : isClaude() ? "Vraag Claude iets…"
    : "Begin van een functie…";
}

// zorgt dat het gekozen lokale model op de GPU staat; is de GPU bezig, dan volgt het daarna
async function warm() {
  const model = $("model").value;
  if (isClaude() || onGpu === model || failed.has(model) || lanes.gpu) return;
  const job = { kind: "load", model, state: "MODEL LADEN", node: busyCard("load") };
  startJob(job); syncLoadCard();
  try { await api().warmup(model); onGpu = model; } catch (err) { failed.add(model); }
  job.node.remove(); endJob(job);
  warm();   // intussen een ander lokaal model gekozen?
}

function onModelChange() {
  applyModel();
  if (!current || !current.turns.length) renderAll();
  syncLoadCard(); refreshUi(); warm();
}

// eigen keuzemenu boven een verborgen <select>, die de bron van waarheid blijft (.value, .options, change)
function initPick(sel) {
  const pick = sel.nextElementSibling, btn = pick.querySelector(".pick-btn"), list = pick.querySelector(".pick-list");
  const label = () => { btn.firstElementChild.textContent = sel.selectedOptions[0]?.textContent || ""; };
  const isOpen = () => !list.classList.contains("hidden");
  const close = () => { list.classList.add("hidden"); pick.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); };
  const choose = (v) => {
    close(); btn.focus();
    if (sel.value !== v) { sel.value = v; label(); sel.dispatchEvent(new Event("change")); }
  };
  const open = () => {
    list.replaceChildren(...[...sel.options].map((o) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "option"); b.textContent = o.textContent;
      b.classList.toggle("on", o.value === sel.value); b.onclick = () => choose(o.value);
      return b;
    }));
    list.classList.remove("hidden"); pick.classList.add("open"); btn.setAttribute("aria-expanded", "true");
    const r = btn.getBoundingClientRect(), h = list.offsetHeight;   // fixed: de zijbalk scrolt en zou de lijst afknippen
    list.style.left = r.left + "px"; list.style.width = r.width + "px";
    list.style.top = (r.bottom + 6 + h <= innerHeight ? r.bottom + 6 : Math.max(6, r.top - 6 - h)) + "px";
    (list.querySelector(".on") || list.firstElementChild)?.focus();
  };
  btn.onclick = () => (isOpen() ? close() : open());
  btn.onkeydown = (e) => { if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !isOpen()) { e.preventDefault(); open(); } };
  list.onkeydown = (e) => {
    const items = [...list.children], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus(); }
    else if (e.key === "Escape" || e.key === "Tab") { close(); if (e.key === "Escape") btn.focus(); }
  };
  document.addEventListener("mousedown", (e) => { if (isOpen() && !pick.contains(e.target)) close(); });
  document.addEventListener("scroll", (e) => { if (isOpen() && e.target.contains?.(pick)) close(); }, true);   // enkel als de knop zelf verschuift
  window.addEventListener("resize", close);
  new MutationObserver(label).observe(sel, { childList: true });   // opties verdwijnen als een model ontbreekt
  label();
}

window.addEventListener("pywebviewready", async () => {
  $("boot-msg").textContent = "OPSTARTEN…";
  try {
    hasClaude = await api().has_claude();
    renderUsage(await api().limits(false));
    resumeClaude();
    refreshUi();
    loadExternal();
  } finally {   // ook bij een fout: het laadscherm mag nooit blijven hangen
    $("boot").classList.add("gone");
    setTimeout(() => $("boot").remove(), 400);
  }
  try {   // torch en de NCM-modellen laden intussen op de achtergrond
    const info = await api().info();
    deviceName = info.device.replace("NVIDIA GeForce ", "").replace(" Laptop GPU", "").toUpperCase();
    [...$("model").options].forEach((o) => { if (o.value !== "claude" && !info.models.includes(o.value)) o.remove(); });
  } catch {}
  onModelChange();
});
$("model").onchange = onModelChange;
initPick($("model"));
$("usage-refresh").onclick = refreshUsage;
function setUsageOpen(on) {
  $("usage").classList.toggle("open", on);
  $("usage-toggle").setAttribute("aria-expanded", on ? "true" : "false");
}
try { setUsageOpen(localStorage.getItem("hygra-usage-open") === "1"); } catch {}
$("usage-toggle").onclick = () => {
  const on = !$("usage").classList.contains("open");
  setUsageOpen(on);
  try { localStorage.setItem("hygra-usage-open", on ? "1" : "0"); } catch {}
};
try { $("funky").checked = localStorage.getItem("hygra-funky") === "1"; } catch {}
function syncVerbose() {
  document.body.classList.toggle("verbose", $("verbose").checked);
  try { localStorage.setItem("hygra-verbose", $("verbose").checked ? "1" : "0"); } catch {}
}
try { $("verbose").checked = localStorage.getItem("hygra-verbose") === "1"; } catch {}
$("verbose").onchange = syncVerbose;
syncVerbose();
function setSide(min) {   // zijbalk in- of uitklappen; blijft onthouden
  $("side").classList.toggle("min", min);
  const b = $("side-btn"), what = min ? "Zijbalk uitklappen" : "Zijbalk inklappen";
  b.setAttribute("aria-expanded", min ? "false" : "true");
  b.setAttribute("aria-label", what); b.title = what + " (Ctrl+B)";
  try { localStorage.setItem("hygra-side", min ? "min" : "open"); } catch {}
}
try { setSide(localStorage.getItem("hygra-side") === "min"); } catch {}
$("side-btn").onclick = () => setSide(!$("side").classList.contains("min"));
document.addEventListener("keydown", (e) => {   // Ctrl+O, like the transcript view in Claude Code; Ctrl+B = zijbalk; Ctrl+N = nieuw gesprek
  if (!e.ctrlKey || e.shiftKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "n") { e.preventDefault(); $("new").click(); }
  else if (k === ",") { e.preventDefault(); setPrefs($("prefs").classList.contains("hidden")); }
  else if (k === "o") { e.preventDefault(); $("verbose").checked = !$("verbose").checked; syncVerbose(); }
  else if (k === "b") { e.preventDefault(); setSide(!$("side").classList.contains("min")); }
});
// instellingen: paneel onder de knop bij het logo (of ernaast als de zijbalk een rail is)
function setPrefs(open) {
  const p = $("prefs"), b = $("prefs-btn");
  p.classList.toggle("hidden", !open);
  b.setAttribute("aria-expanded", open ? "true" : "false");
  if (!open) return;
  const r = b.getBoundingClientRect(), rail = $("side").classList.contains("min");
  const left = rail ? r.right + 10 : $("side").getBoundingClientRect().left + 12;
  p.style.left = Math.max(8, Math.min(left, innerWidth - p.offsetWidth - 8)) + "px";
  p.style.top = Math.max(8, Math.min(rail ? r.top : r.bottom + 8, innerHeight - p.offsetHeight - 8)) + "px";
  p.querySelector("input:checked")?.focus();
}
$("prefs-btn").onclick = () => setPrefs($("prefs").classList.contains("hidden"));
$("prefs").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); setPrefs(false); $("prefs-btn").focus(); } });
document.addEventListener("mousedown", (e) => { if (!$("prefs").contains(e.target) && !$("prefs-btn").contains(e.target)) setPrefs(false); });
window.addEventListener("resize", () => setPrefs(false));

// thema: HYDRARGYRUM (olijf), NIGHT CITY (cyberpunk) of WAIFU; app.py onthoudt het ook, zodat de splash meekleurt
const THEMES = ["hg", "cyber", "waifu"];
const themeNow = () => THEMES.find((t) => document.body.classList.contains(t)) || "hg";
function setTheme(t) {
  for (const k of THEMES) document.body.classList.toggle(k, k === t && k !== "hg");
  for (const r of document.querySelectorAll('input[name="theme"]')) r.checked = r.value === t;
  try { localStorage.setItem("hygra-theme", t); } catch {}
  window.pywebview?.api?.theme(t).catch(() => {});
  if (t === "waifu") loadWaifus();
}
for (const r of document.querySelectorAll('input[name="theme"]')) r.onchange = () => setTheme(r.value);

// waifu: de figuren staan enkel lokaal (%LOCALAPPDATA%\HyGra\themes\waifu), app.py geeft ze als data-URL's
let waifuArt = null;
async function loadWaifus() {
  if (waifuArt || !window.pywebview?.api) return;
  waifuArt = await api().waifu().catch(() => ({}));
  const names = Object.keys(waifuArt), box = $("waifus");
  if (!names.length) {
    const m = document.createElement("small");
    m.className = "keys"; m.textContent = "Geen figuren gevonden in %LOCALAPPDATA%\\HyGra\\themes\\waifu";
    box.replaceChildren(m); return;
  }
  box.replaceChildren(...names.map((n) => {
    const l = document.createElement("label"), i = document.createElement("input"), face = document.createElement("span");
    i.type = "radio"; i.name = "waifu"; i.value = n; i.onchange = () => setWaifu(n);
    i.setAttribute("aria-label", n[0].toUpperCase() + n.slice(1));
    face.style.backgroundImage = `url(${waifuArt[n]})`;
    l.title = n[0].toUpperCase() + n.slice(1); l.append(i, face);
    return l;
  }));
  setWaifu(names.includes(document.body.dataset.waifu) ? document.body.dataset.waifu : names.includes("ishtar") ? "ishtar" : names[0]);
}
function setWaifu(n) {
  document.body.dataset.waifu = n;
  try { localStorage.setItem("hygra-waifu", n); } catch {}
  $("waifu-art").style.backgroundImage = waifuArt?.[n] ? `url(${waifuArt[n]})` : "";
  for (const r of document.querySelectorAll('input[name="waifu"]')) r.checked = r.value === n;
}
setTheme(themeNow());
window.addEventListener("pywebviewready", () => setTheme(themeNow()));

$("funky").onchange = () => { try { localStorage.setItem("hygra-funky", $("funky").checked ? "1" : "0"); } catch {} syncFunky(); };
$("form").onsubmit = send;
$("prompt").addEventListener("focus", warmCurrent);
$("prompt").addEventListener("keydown", (e) => {   // Enter = versturen (tussendoor als Claude bezig is), Shift+Enter = nieuwe regel, Esc = stop
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) send(e);
  else if (e.key === "Escape" && viewJob()) { e.preventDefault(); stopJob(viewJob()); }
});
$("prompt").addEventListener("input", () => { if (viewJob()) refreshUi(); });
$("hist-src").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  histSrc = b.dataset.src; try { localStorage.setItem("hygra-hist", histSrc); } catch {}
  renderHistory();
};
$("hist-find").oninput = renderHistory;
$("log").addEventListener("click", (e) => {   // bestandslink: openen met de standaard-app (map → Verkenner)
  const a = e.target.closest("a.file");
  if (!a) return;
  e.preventDefault();
  api().open_path(a.dataset.full).then((r) => { if (r && r.error) setStatus("Kan niet openen: " + r.error); });
});
$("new").onclick = () => { current = null; renderAll(); $("prompt").focus(); };
$("temp").oninput = () => $("tval").textContent = (+$("temp").value).toFixed(1);
$("chunks").oninput = () => $("cval").textContent = $("chunks").value;
$("showlv").onchange = renderAll;
applyModel();
renderAll();
</script>
</body>
