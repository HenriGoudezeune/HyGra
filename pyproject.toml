[project]
name = "ncm-code"
version = "0.1.0"
description = "Small Next-Concept Modeling (NCM) model for code generation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.7",
    "tiktoken>=0.8",
    "numpy>=1.26",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
