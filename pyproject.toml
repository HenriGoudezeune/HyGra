[project]
name = "ncm-code"
version = "0.1.0"
description = "Small Next-Concept Modeling (NCM) model for code generation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "transformers>=4.46",
    "peft>=0.13",
    "pywebview>=5.0",
    "pillow>=10",
    "anthropic>=1.0",
    "keyring>=25",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
